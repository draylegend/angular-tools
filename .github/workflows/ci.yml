name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check out the grammar that extension.toml names
        run: |
          repository=$(sed -n 's/^repository = "\(.*tree-sitter.*\)"/\1/p' extension.toml)
          rev=$(sed -n 's/^rev = "\(.*\)"/\1/p' extension.toml)
          git clone --quiet "$repository" grammars/angular
          git -C grammars/angular checkout --quiet "$rev"
      - run: npm ci
      - run: npm test
      - if: runner.os == 'Linux'
        run: rustup target add wasm32-wasip2
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - if: runner.os == 'Linux'
        run: cargo clippy --locked --target wasm32-wasip2 -- --deny warnings
      - if: runner.os == 'Linux'
        run: cargo build --locked --target wasm32-wasip2
