id = "angular-tools"
name = "Angular Tools"
description = "Angular templates with the official Angular Language Server."
version = "0.19.0"
schema_version = 1
authors = ["Vladimir Drayling <draylegend@gmail.com>"]
repository = "https://github.com/draylegend/angular-tools"

[language_servers.angular-tools]
name = "Angular Language Server"
# Like the official VS Code client, the server starts for every HTML file and
# turns itself off in projects without @angular/core. TypeScript files get
# Angular support from vtsls with the Angular tsserver plugin instead.
languages = ["Angular", "HTML"]

[language_servers.angular-tools.language_ids]
"Angular" = "html"
"HTML" = "html"

[language_servers.angular-tools-emmet]
name = "Emmet for Angular inline templates"
# The Emmet extension does not cover TypeScript files. This server answers only
# inside `template:` strings of components, which it sees as HTML.
languages = ["TypeScript"]

[language_servers.angular-tools-emmet.language_ids]
"TypeScript" = "html"

[language_servers.angular-tools-tailwind]
name = "Tailwind CSS for Angular templates"
# Zed's own Tailwind server covers HTML but not the Angular language.
languages = ["Angular"]

[language_servers.angular-tools-tailwind.language_ids]
"Angular" = "html"

[language_servers.angular-tools-html]
name = "HTML for Angular templates"
# The Angular Language Server leaves out plain HTML and CSS. In TypeScript files
# this server answers only inside `template:` strings.
languages = ["Angular", "TypeScript"]

[language_servers.angular-tools-html.language_ids]
"Angular" = "html"
"TypeScript" = "html"

# Looks for Angular projects in nested folders, which the extension API cannot list.
[[capabilities]]
kind = "process:exec"
command = "*"
args = ["*", "*"]

[grammars.angular]
repository = "https://github.com/dlvandenberg/tree-sitter-angular"
rev = "38a8014ed5452cd6b7cf1399c00177a1f5374256"
