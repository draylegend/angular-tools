name = "Angular"
grammar = "angular"
path_suffixes = ["component.html", "ng.html"]
block_comment = { start = "<!--", prefix = "", end = "-->", tab_size = 0 }
tab_size = 2
# Selectors such as `app-card` stay one word while completions are filtered.
completion_query_characters = ["-"]
# `app-card` stays one name while both of its tags are edited together.
linked_edit_characters = ["-"]
wrap_characters = { start_prefix = "<", start_suffix = ">", end_prefix = "</", end_suffix = ">" }
autoclose_before = ">})]\"'"
brackets = [
  # Closes an unfinished opening tag: `<app-card` + `/` gives `<app-card/>`.
  # cursor_after_end puts the caret after `>` in Zed builds that support it;
  # others ignore the key and leave the caret before `>`.
  { start = "/", end = ">", close = true, surround = false, newline = false, cursor_after_end = true, not_in = ["comment", "string", "markup"] },
  { start = "{", end = "}", close = true, newline = true, not_in = ["comment"] },
  { start = "[", end = "]", close = true, newline = true, not_in = ["comment"] },
  { start = "(", end = ")", close = true, newline = true, not_in = ["comment"] },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "<", end = ">", close = false, newline = true, not_in = ["comment", "string"] },
]
